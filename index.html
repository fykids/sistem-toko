<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="csrf-token" content="" />
        <title>Sistem Toko Mobil</title>
        <script>
            try {
                window.spaUser = JSON.parse(sessionStorage.getItem('spaUser') || 'null');
            } catch {
                sessionStorage.removeItem('apiToken');
                sessionStorage.removeItem('spaUser');
                window.spaUser = null;
            }
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/resources/js/spa.js"></script>
    </body>
</html>
